services:
  openvpn-as:
    image: openvpn/openvpn-as:latest
    container_name: openvpn-as
    restart: unless-stopped

    devices:
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - MKNOD

    ports:
      - "943:943"          # Admin UI + Client UI (HTTPS)
      - "443:443"          # TCP VPN (optional but common)
      - "1194:1194/udp"    # UDP VPN (common)

    volumes:
      - ./openvpn-as-data:/openvpn
